<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ECHO"><link rel="manifest" href="manifest.json">
<title>ECHO</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#24231f;--muted:#777269;--line:#ddd8ce}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 18px 100px}header{padding:0 4px 18px}h1{font-size:27px;line-height:1.08;margin:0 0 7px;letter-spacing:-.7px}header p{margin:0;color:var(--muted)}
nav{display:flex;gap:8px;margin:8px 0 18px}nav button{flex:1;border:1px solid var(--line);background:transparent;border-radius:14px;padding:11px;color:var(--muted);font-weight:650}nav button.active{background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px}.date,.source,.label{font-size:12px;color:var(--muted)}.date{margin-bottom:8px}.thought{font-size:18px;line-height:1.32}.source{font-size:13px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:45px 20px}
.capture{position:fixed;left:18px;right:18px;bottom:15px;max-width:524px;margin:auto;border:0;border-radius:18px;background:#30342f;color:white;padding:17px;font-size:16px;font-weight:750;box-shadow:0 10px 30px #0003}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(560px,100%);background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px 30px}.sheet h2{margin:0 0 5px}.sheet p{color:var(--muted);font-size:14px}textarea,input{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px;font:inherit;background:white;margin-top:9px}textarea{min-height:120px;resize:none}.save{width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;background:#30342f;color:white;font-weight:700}.close{width:100%;border:0;background:transparent;padding:12px;color:var(--muted)}
.small{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;margin-top:12px}.label{text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
</style></head><body><div class="app">
<header><h1>Capture the moments that make you think.</h1><p>See where they take you.</p></header>
<nav><button id="t" class="active">Timeline</button><button id="r">Reflect</button></nav><main id="main"></main>
<button class="capture" id="cap">＋ Capture a moment</button></div>
<div class="modal" id="modal"><div class="sheet"><h2>Capture a moment</h2><p>Don’t organize it. Just save it. You can add context later.</p>
<textarea id="thought" placeholder="What made you stop and think? (optional)"></textarea>
<input id="source" placeholder="Where did it come from? (optional)"><input id="anchor" placeholder="Timestamp, page, link, or other anchor (optional)">
<button class="save" id="save">Save moment</button><button class="close" id="close">Cancel</button></div></div>
<script>
const K="echo_v1";let data=JSON.parse(localStorage.getItem(K)||"null")||[
{id:"1",date:"Sep 11, 2026",thought:"Maybe discipline isn't the problem. Maybe my environment is.",source:"Podcast — The Knowledge Project",anchor:"42:18"},
{id:"2",date:"Sep 6, 2026",thought:"I keep returning to the idea that the questions we ask shape the lives we build.",source:"Conversation",anchor:"Dinner"},
{id:"3",date:"Aug 29, 2026",thought:"What if changing my mind is evidence of progress rather than inconsistency?",source:"Book — Thinking in Bets",anchor:"p. 117"}];
const main=document.getElementById("main");const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.getElementById("t").classList.toggle("active",location.hash!="#reflect");document.getElementById("r").classList.toggle("active",location.hash=="#reflect");if(location.hash=="#reflect")reflect();else timeline()}
function timeline(){main.innerHTML=data.length?data.map(m=>`<article class="card" onclick="detail('${m.id}')"><div class="date">${esc(m.date)}</div><div class="thought">${esc(m.thought)||"Captured moment"}</div>${m.source?`<div class="source">${esc(m.source)}${m.anchor?" · "+esc(m.anchor):""}</div>`:""}</article>`).join(""):'<div class="empty">Your timeline is empty.<br><br>Capture the first moment that makes you think.</div>'}
function detail(id){let m=data.find(x=>x.id==id);main.innerHTML=`<button class="close" onclick="location.hash=''">← Timeline</button><article class="card"><div class="date">${esc(m.date)}</div><div class="thought">${esc(m.thought)||"Captured moment"}</div><div class="source">${esc(m.source||"")}${m.anchor?" · "+esc(m.anchor):""}</div><button class="small" onclick="alert('The native version will return you to the original source and position.')">↩ Return to the moment</button></article>`}
function reflect(){let a=data[0],b=data[data.length-1];main.innerHTML=`<article class="card"><div class="label">ECHO noticed</div><h2>Your timeline is beginning to tell a story.</h2><p style="color:var(--muted);line-height:1.45">What do you notice?</p><div class="label">Then</div><div class="thought">${esc(a?.thought)}</div><div class="label" style="margin-top:18px">Now</div><div class="thought">${esc(b?.thought)}</div><textarea id="ref" placeholder="What do you think now? (optional)"></textarea><button class="save" onclick="addRef()">Save reflection</button></article>`}
function addRef(){let v=document.getElementById("ref").value.trim();if(!v)return;data.unshift({id:Date.now(),date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),thought:v,source:"Reflection"});localStorage.setItem(K,JSON.stringify(data));location.hash=""}
document.getElementById("cap").onclick=()=>modal.style.display="flex";document.getElementById("close").onclick=()=>modal.style.display="none";
document.getElementById("save").onclick=()=>{data.unshift({id:Date.now(),date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),thought:thought.value.trim(),source:source.value.trim(),anchor:anchor.value.trim()});localStorage.setItem(K,JSON.stringify(data));thought.value=source.value=anchor.value="";modal.style.display="none";render()};
document.getElementById("r").onclick=()=>location.hash="reflect";document.getElementById("t").onclick=()=>location.hash="";onhashchange=render;render();
</script></body></html>
