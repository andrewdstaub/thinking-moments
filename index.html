<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thinking Moments">
<link rel="manifest" href="manifest.json">
<title>Thinking Moments</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#24231f; --muted:#777269;
  --line:#ddd8ce; --accent:#30342f; --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(112px + var(--safe-bottom))}
header{padding:4px 4px 16px}
h1{font-size:27px;line-height:1.08;margin:0 0 7px;letter-spacing:-.7px}
header p{margin:0;color:var(--muted);font-size:15px}
nav{display:flex;gap:8px;margin:8px 0 18px}
nav button{flex:1;border:1px solid var(--line);background:transparent;border-radius:14px;padding:11px;color:var(--muted);font-weight:650}
nav button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000000b}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:12px}
.date,.source,.label{font-size:12px;color:var(--muted)}
.date{margin-bottom:8px}
.thought{font-size:18px;line-height:1.34}
.source{font-size:13px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:54px 22px;line-height:1.5}
.capture{
  position:fixed;left:18px;right:18px;bottom:calc(14px + var(--safe-bottom));
  max-width:524px;margin:auto;border:0;border-radius:18px;background:var(--accent);color:white;
  padding:17px;font-size:16px;font-weight:750;box-shadow:0 10px 30px #0003;z-index:20
}
.toast{
  position:fixed;left:50%;bottom:calc(88px + var(--safe-bottom));transform:translateX(-50%);
  background:#24231f;color:white;padding:10px 14px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.2s;z-index:50
}
.toast.show{opacity:1}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40
}
.sheet{
  position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + var(--safe-bottom));
  overflow:auto
}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheet h2{margin:0;font-size:24px}
.sheet .dismiss{border:0;background:transparent;color:var(--muted);font-size:16px;padding:8px 0 8px 12px}
.sheet .helper{color:var(--muted);font-size:14px;line-height:1.4;margin:0 0 14px}
.field-label{font-size:14px;font-weight:700;margin:14px 0 7px}
textarea,input{
  width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;background:white;color:var(--ink)
}
textarea{min-height:170px;resize:none;font-size:18px;line-height:1.4}
input{font-size:16px}
textarea:focus,input:focus{outline:3px solid #8cb5df55;border-color:#6e9ec7}
.save{
  width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:white;font-weight:750;font-size:16px
}
.reflect-card h2{font-size:22px;margin:0 0 8px}
.reflect-note{color:var(--muted);line-height:1.5;margin:0}
.reflect textarea{min-height:120px}
.reflect{padding-bottom:96px}
body.keyboard-open .capture{display:none}
body.keyboard-open .app{padding-bottom:calc(24px + var(--safe-bottom))}
.detailBack{border:0;background:none;padding:0 0 15px;color:var(--muted);font-size:14px}
.smallbtn{margin-top:12px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px}
.moment-new{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (min-width:700px){
  .modal{display:none!important}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Capture the moments that make you think.</h1>
  <p>See where they take you.</p>
</header>

<nav>
  <button id="timelineTab" class="active">Timeline</button>
  <button id="reflectTab">Reflect</button>
</nav>

<main id="main"></main>
<button class="capture" id="captureBtn">＋ Capture a moment</button>
</div>

<div class="toast" id="toast">Saved.</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="captureTitle">
    <div class="sheet-top">
      <h2 id="captureTitle">Capture a moment</h2>
      <button class="dismiss" id="close">Cancel</button>
    </div>

    <p class="helper">Don’t organize it. Just save what made you stop and think.</p>

    <label class="field-label" for="thought">What made you stop and think?</label>
    <textarea id="thought" placeholder="Type the thought, quote, question, or reaction here"></textarea>

    <label class="field-label" for="source">Source <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input id="source" placeholder="Podcast, book, conversation, article...">

    <label class="field-label" for="anchor">Anchor <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input id="anchor" placeholder="Timestamp, page, link, or cue">

    <button class="save" id="save">Save moment</button>
  </div>
</div>

<script>
const KEY="echo_v1";
const seed=[
 {id:"s1",date:"Sep 11, 2026",thought:"Maybe discipline isn't the problem. Maybe my environment is.",source:"Podcast — The Knowledge Project",anchor:"42:18"},
 {id:"s2",date:"Sep 6, 2026",thought:"I keep returning to the idea that the questions we ask shape the lives we build.",source:"Conversation",anchor:"Dinner"},
 {id:"s3",date:"Aug 29, 2026",thought:"What if changing my mind is evidence of progress rather than inconsistency?",source:"Book — Thinking in Bets",anchor:"p. 117"}
];

let moments=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
let view="timeline";
let justAdded=null;

const main=document.getElementById("main");
const modal=document.getElementById("modal");
const thought=document.getElementById("thought");
const source=document.getElementById("source");
const anchor=document.getElementById("anchor");
const toast=document.getElementById("toast");

function saveData(){localStorage.setItem(KEY,JSON.stringify(moments))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function showToast(msg="Saved."){
  toast.textContent=msg;toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),900)
}
function render(){
  document.body.classList.remove("keyboard-open");
  document.getElementById("timelineTab").classList.toggle("active",view==="timeline");
  document.getElementById("reflectTab").classList.toggle("active",view==="reflect");
  const cap=document.getElementById("captureBtn");
  if(view==="reflect"){
    cap.textContent="＋ Capture";
    cap.style.maxWidth="220px";
    cap.style.left="auto";
    cap.style.right="18px";
    cap.style.margin="0";
  } else {
    cap.textContent="＋ Capture a moment";
    cap.style.maxWidth="524px";
    cap.style.left="18px";
    cap.style.right="18px";
    cap.style.margin="auto";
  }
  if(view==="timeline") renderTimeline(); else renderReflect();
}
function renderTimeline(){
  if(!moments.length){
    main.innerHTML='<div class="empty">Your timeline is empty.<br><br>Capture the first moment that makes you think.</div>';
    return;
  }
  main.innerHTML=moments.map(m=>`<article class="card ${m.id===justAdded?"moment-new":""}" data-id="${m.id}">
    <div class="date">${esc(m.date)}</div>
    <div class="thought">${esc(m.thought)||"Captured moment"}</div>
    ${(m.source||m.anchor)?`<div class="source">${esc(m.source||"")}${m.source&&m.anchor?" · ":""}${esc(m.anchor||"")}</div>`:""}
  </article>`).join("");
  document.querySelectorAll(".card[data-id]").forEach(c=>c.onclick=()=>detail(c.dataset.id));
  justAdded=null;
}
function detail(id){
  const m=moments.find(x=>String(x.id)===String(id)); if(!m)return;
  main.innerHTML=`<button class="detailBack" onclick="render()">← Timeline</button>
  <article class="card">
    <div class="date">${esc(m.date)}</div>
    <div class="thought">${esc(m.thought)||"Captured moment"}</div>
    ${m.source?`<div class="source">${esc(m.source)}</div>`:""}
    ${m.anchor?`<div class="source">Anchor: ${esc(m.anchor)}</div>`:""}
    <button class="smallbtn" onclick="alert('The native version will return you to the original source and position.')">↩ Return to the moment</button>
  </article>`;
}
function renderReflect(){
  const userMoments=moments.filter(m=>m.source!=="Reflection");
  if(userMoments.length<2){
    main.innerHTML=`<section class="card reflect-card">
      <div class="label">REFLECT</div>
      <h2>Keep capturing.</h2>
      <p class="reflect-note">Once you have a few moments in your timeline, you can come back here to revisit one and see what it brings up now.</p>
    </section>`;
    return;
  }

  // Revisit one prior non-reflection moment rather than forcing a connection
  // between two unrelated moments. Choose an older moment, not the newest.
  const prior=userMoments[userMoments.length-1];

  main.innerHTML=`<section class="card reflect">
    <div class="label">REFLECT</div>
    <h2>Look back. Think forward.</h2>
    <p class="reflect-note">Revisit something you captured and see what it brings up now.</p>

    <div class="label" style="margin-top:20px">You captured</div>
    <div class="thought">${esc(prior?.thought||"—")}</div>
    ${(prior?.source||prior?.anchor)?`<div class="source">${esc(prior.source||"")}${prior.source&&prior.anchor?" · ":""}${esc(prior.anchor||"")}</div>`:""}

    <label class="field-label" for="reflection">What do you think now?</label>
    <textarea id="reflection" placeholder="Add a reflection (optional)"></textarea>
    <button class="save" onclick="addReflection()">Save reflection</button>
  </section>`;
}
function addReflection(){
  const el=document.getElementById("reflection");
  const v=el?.value.trim(); if(!v)return;
  const item={id:crypto.randomUUID?crypto.randomUUID():Date.now(),date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),thought:v,source:"Reflection"};
  moments.unshift(item); saveData(); justAdded=item.id; view="timeline"; render(); showToast("Reflection saved.");
}
function openCapture(){
  modal.style.display="block";modal.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  setTimeout(()=>thought.focus(),180);
}
function closeCapture(){
  modal.style.display="none";modal.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

function setKeyboardState(on){
  document.body.classList.toggle("keyboard-open", !!on);
}
["focusin","focusout"].forEach(evt=>{
  document.addEventListener(evt,e=>{
    if(e.target && (e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT")){
      if(evt==="focusin") setKeyboardState(true);
      else setTimeout(()=>setKeyboardState(false),120);
    }
  });
});

document.getElementById("timelineTab").onclick=()=>{view="timeline";render()};
document.getElementById("reflectTab").onclick=()=>{view="reflect";render()};
document.getElementById("captureBtn").onclick=openCapture;
document.getElementById("close").onclick=closeCapture;
document.getElementById("save").onclick=()=>{
  const item={
    id:crypto.randomUUID?crypto.randomUUID():Date.now(),
    date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),
    thought:thought.value.trim(),
    source:source.value.trim(),
    anchor:anchor.value.trim()
  };
  moments.unshift(item); saveData(); justAdded=item.id;
  thought.value=source.value=anchor.value="";
  closeCapture(); view="timeline"; render(); showToast("Saved.");
};
render();
</script>
</body>
</html>
